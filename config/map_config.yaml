# -----------------------------------------------------------------------------
# 6. ALIASES - raw Steam text -> one of our features
#
# HOW THIS WORKS, because it is the part people find confusing:
#
#   "Open World" is listed below, so it becomes a weighted structure feature.
#   "Great Soundtrack" is NOT listed, so it becomes a display-only tag.
#
# Nothing is ever thrown away. Unlisted text still ends up on the game, just
# in the `tag` category which has weight 0.0. So the only thing adding an
# alias changes is whether the ML pays attention to it.
#
# A string listed here does NOT also become a tag. That is how we follow the
# rule about not counting the same concept twice.
#
# To find what is worth adding next, look at the "most common unmapped tags"
# section of data/import_report.md after an import. That is your to-do list.
#
# Matching ignores capitalisation.
# -----------------------------------------------------------------------------
aliases:
  # --- from the `genres` column ---
  "Action": [genre, action]
  "Adventure": [genre, adventure]
  "RPG": [genre, rpg]
  "Role Playing": [genre, rpg]
  "Strategy": [genre, strategy]
  "Simulation": [genre, simulation]
  "Sports": [genre, sports]
  "Racing": [genre, racing]
  "Casual": [genre, casual]
  "Massively Multiplayer": [genre, massively_multiplayer]

  # --- tags that are really genres ---
  "Shooter": [genre, shooter]
  "FPS": [genre, shooter]
  "Platformer": [genre, platformer]
