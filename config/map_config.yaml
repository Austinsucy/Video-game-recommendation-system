# =============================================================================
# THE ONE SETTINGS FILE
#
# Our MAINT 2 requirement says every tunable thing lives in a single config
# file, so changing a weight or a tag mapping never means editing Python.
# This is that file.
#
# If you are new to the project, the sections go:
#   1. dataset      where the source CSV is
#   2. selection    which ~1000 games we pick out of the 89,618 available
#   3. fields       which CSV column becomes which database column
#   4. weights      how much each feature category counts for the ML
#   5. vocabulary   the official list of features
#   6. aliases      raw text from Steam -> one of those features
#   plus vectorization and layout, which Kayne's map pipeline reads
#
# One thing to know: publish_map() copies this whole file into
# map_versions.config_snapshot_json every time a map is published. So every
# map we ever build carries a permanent record of the exact settings that
# produced it. That is why it is worth keeping this file tidy.
#
# WHO OWNS WHAT
#   Ronnie   dataset, selection, fields
#   Austin   vocabulary, aliases, which games we include
#   Kayne    category_weights, cluster_count, random_seed
#
# 2026-11-02 (Austin): first vocabulary pass. Added 15 features and 64 aliases
# for the most common unmapped tags. Art style, mood, content warnings and
# business tags (Indie, Atmospheric, Pixel Graphics, Violent...) stay
# display-only on purpose. "Tactical" stays display-only too: it covers both
# tactical shooters and tactics games (docs/decisions.md, decision 6). Takes effect only after `python -m pipeline.ingest
# --reset`; published map v1 is unchanged.
# =============================================================================

map_version: "v2"
random_seed: 42          # REL 2: every randomised step in the pipeline uses this
cluster_count: 12        # placeholder - Austin/Kayne decide
kmeans_n_init: 10        # K-Means restarts from different seeded centroids; the lowest-inertia run wins

# -----------------------------------------------------------------------------
# Dataset + selection rule
# -----------------------------------------------------------------------------
dataset:
  csv_path: "data/raw/games_march2025_cleaned.csv"
  source_name: "kaggle_artermiloff_steam_2025"
  retrieved_at: "2025-03-01"          # snapshot date of the Kaggle export
  store_url_template: "https://store.steampowered.com/app/{appid}/"

selection:
  target_count: 1000                  # CON 3 caps the published map at 1100

  # HOW WE CHOOSE THE 1000
  #   popular_recent   newest years first, most reviewed  <- what we use now
  #   popular_pre2019  only <= max_year, most reviewed    <- what CON 3 says
  #
  # HEADS UP: these two disagree with each other. CON 3 in the NFR document
  # says the map is "approximately 1,000 mostly pre-2019 games", but we are
  # currently building from 2019 onward. Changing this one word and re-running
  # the import switches it. Still needs a team decision.
  mode: "popular_recent"

  max_year: 2018                      # only used by popular_pre2019
  min_year: 2019                      # only used by popular_recent

  # We sort by this and take the top N. It has to be a column that is filled
  # in for every game, otherwise the sort is meaningless.
  rank_by: "num_reviews_total"

  # When two games tie on review count, we fall back to alphabetical. Without
  # a tie-breaker the order would depend on how pandas happened to sort that
  # day, and two people running the import could get different 1000 games.
  # REL 2 would be impossible.
  tie_breaker: "title"

  # DATA 1 minimums. A game needs at least this much information or we skip it.
  min_genres: 1
  min_tags: 3

  # Steam's "genres" column includes things that are not games at all
  # (Accounting, Utilities, Audio Production). Listing them here drops those
  # rows entirely. Currently empty because the team decided to keep them.
  exclude_genres: []

  # These ARE in Steam's genres column but they are not really genres. They
  # are content warnings or business models. We still record them on the game,
  # but as display-only `tag` features so the ML does not treat "Indie" as a
  # genre with the same importance as "RPG".
  demote_genres_to_tags:
    - "Early Access"
    - "Free To Play"
    - "Indie"
    - "Gore"
    - "Nudity"
    - "Violent"
    - "Sexual Content"

  # Steam's "categories" column is mostly store features we do not care about
  # (Trading Cards, Remote Play, HDR). Only these ones say something about how
  # many people play, so only these become multiplayer features. Anything not
  # listed here is ignored.
  multiplayer_categories:
    "Single-player": single_player
    "Multi-player": multiplayer
    "Co-op": co_op
    "Online Co-op": online_co_op
    "LAN Co-op": lan_co_op
    "PvP": pvp
    "Online PvP": online_pvp
    "LAN PvP": lan_pvp
    "MMO": mmo
    "Shared/Split Screen": split_screen
    "Shared/Split Screen Co-op": split_screen_co_op
    "Shared/Split Screen PvP": split_screen_pvp
    "Cross-Platform Multiplayer": cross_platform
    "Remote Play Together": remote_play_together


# -----------------------------------------------------------------------------
# 3. FIELDS - which CSV column becomes which database column
#
# This section is the answer to "where did this value come from?". Every
# column in our `games` table is listed, with the exact CSV column it reads
# and any conversion applied on the way in.
#
# The import builds its list of CSV columns to read from this section, so
# nothing is loaded that we do not actually use. Add a mapping here and the
# importer picks it up with no code change.
#
# Available transforms (defined in pipeline/ingest.py):
#   normalise_title       lowercase, strip punctuation, collapse spaces
#   year_from_date        pull the year out of a date string
#   iso_date              tidy a date into YYYY-MM-DD
#   join_list             turn ['A', 'B'] into "A, B", dropping duplicates
#   store_url_template    build a Steam store URL from the app id
#   minutes_to_hours      divide by 60, round to 2 dp
#   json_dump             store the value as JSON text
#   clean_text            trim whitespace, turn empty strings into NULL
# -----------------------------------------------------------------------------
fields:
  # Not read from the CSV. This is the label we store in games.rating_scale to
  # say what the `rating` number means, so nobody has to guess whether 85 is
  # out of 100 or out of 5.
  rating_scale: "0-100"

  column_sources:

    title:
      from: name
      transform: clean_text
      note: "Shown on screen exactly as Steam spells it."

    title_search:
      from: name
      transform: normalise_title
      note: "Lowercased, punctuation stripped. What we actually search on."

    release_date:
      from: release_date
      transform: iso_date
      note: "Full date as YYYY-MM-DD, for the info panel. Always present in our data."

    release_year:
      from: release_date
      transform: year_from_date
      note: >
        Same source as release_date, kept separately so filtering by year does
        not mean parsing 89,618 strings every import.

    description:
      from: short_description
      transform: clean_text
      note: "Steam's one or two sentence blurb. Max ~342 characters."

    # Steam ships two long descriptions and they are identical 84% of the time.
    # When they differ, detailed_description usually opens with store sales
    # copy ("Shadow of the Erdtree Edition includes...") while about_the_game
    # goes straight into the real text. So we prefer about_the_game and only
    # fall back to detailed_description when it is missing.
    long_description:
      from: about_the_game
      fallback: detailed_description
      transform: clean_text
      note: "Full 'About This Game' text, ~1,400 chars average. Detail view only."

    # Plural on purpose. About 8% of games have more than one developer and
    # one has 41, so calling the column `developer` would be a lie. Stored as
    # comma-joined text because we only display these, we do not search on them.
    developers:
      from: developers
      transform: join_list
      note: "Studio name(s), comma-joined. Missing for a small number of games."

    publishers:
      from: publishers
      transform: join_list
      note: "Publisher name(s), comma-joined. Missing more often than developers."

    cover_image_url:
      from: header_image
      note: "Steam's banner image. Always present in our data."

    store_url:
      from: appid
      transform: store_url_template
      note: "Built from the app id, not stored in the CSV directly."

    playtime_hours:
      from: average_playtime_forever
      transform: minutes_to_hours
      zero_is_missing: true
      note: >
        Steam's lifetime average playtime, in MINUTES in the source. This is an
        average over players Steam has data for, not a how-long-to-beat figure.
        Missing for about a third of games.

    rating:
      from: pct_pos_total
      note: >
        Percentage of reviews that are positive, 0 to 100. We use this instead
        of metacritic_score (missing for 96% of games) or user_score (missing
        for 99.96%).

    rating_count:
      from: num_reviews_total
      note: "How many reviews that percentage is based on."

    popularity:
      from: num_reviews_total
      note: >
        Deliberately the same source as rating_count. Review count was the only
        fully populated numeric signal. Swap to peak_ccu if we want popularity
        to mean something different from review volume.

    raw_tags_json:
      from: tags
      transform: json_dump
      note: >
        The untouched tag object from Steam, including vote counts. Kept
        because game_features loses the counts, and our import rules say to
        preserve the raw tags.

  # Where each feature CATEGORY gets its values from. This is informational,
  # the matching logic lives in ingest.py, but writing it down here means the
  # config snapshot records it for every published map.
  feature_sources:
    genre:       {from: genres,                via: direct_or_alias}
    multiplayer: {from: categories,            via: multiplayer_categories}
    platform:    {from: [windows, mac, linux], via: boolean_columns}
    tag:         {from: tags,                  via: fallthrough}
    gameplay:    {from: tags,                  via: aliases}
    mechanic:    {from: tags,                  via: aliases}
    structure:   {from: tags,                  via: aliases}
    theme:       {from: tags,                  via: aliases}
    perspective: {from: tags,                  via: aliases}


# -----------------------------------------------------------------------------
# NOTE: only the `category_weighted` vectorization method reads these weights.
# The other methods work on raw tag votes. Which method publishes is an open
# team decision (GM 1).
#
# Category weights - Austin/Kayne tune these. `python -m pipeline.tune_weights`
# found no weights that do better on held-out similar pairs (docs/decisions.md,
# decision 4), so these are unchanged.
# `tag` is 0.0 on purpose: the scrum doc says display tags must not become an
# extra weighted category or double-count a concept already captured elsewhere.
# -----------------------------------------------------------------------------
category_weights:
  genre: 1.0
  gameplay: 1.0
  mechanic: 1.0
  structure: 0.8
  theme: 0.8
  multiplayer: 0.5
  perspective: 0.5
  platform: 0.2
  tag: 0.0

# -----------------------------------------------------------------------------
# Tag vectorization (pipeline/vectorize.py). Compare the methods with
# `python -m pipeline.compare_vectors`, then set `method` to the winner.
# -----------------------------------------------------------------------------
vectorization:
  method: "votes_max"          # chosen 2026-11-02 for map v2 (docs/decisions.md, decision 4); v1 used votes_log_idf
  description_floor: 0.4       # weight of a present tag the description never mentions
  hybrid_alpha: 0.7            # hybrid_* = alpha * votes_log + (1 - alpha) * description
  rank_depth: 20               # Steam keeps each game's top 20 tags
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"   # pinned Hugging Face commit (REL 2)
  embedding_tag_template: "a video game tagged {tag}"

# -----------------------------------------------------------------------------
# Map layout (pipeline/build_map.py). cluster_count and random_seed are above.
# -----------------------------------------------------------------------------
layout:
  neighbor_count: 15           # neighbours stored per game; the scrum doc allows 10-15
  method: "tsne"               # tsne keeps ~4x more true neighbours close on the map than pca; GM 1 originally said PCA
  tsne_perplexity: 30          # roughly how many neighbours t-SNE preserves per game
  coordinate_extent: 1000.0    # layout output is scaled so the largest |x| or |y| equals this (collision separation can push a point slightly past it)
  collision_min_distance: 1.0  # games closer than this (e.g. identical tag vectors) are spread apart
  # Colour-blind-friendly (ACC 3): Okabe-Ito, then four Paul Tol "muted" colours.
  # Twelve categorical colours cannot all be told apart at a glance, so the legend
  # must always label clusters by name, never by colour alone.
  cluster_colors:
    - "#E69F00"
    - "#56B4E9"
    - "#009E73"
    - "#F0E442"
    - "#0072B2"
    - "#D55E00"
    - "#CC79A7"
    - "#999999"
    - "#882255"
    - "#44AA99"
    - "#DDCC77"
    - "#332288"

