# =============================================================================
# TRANSLATION - map v4 (test/map-v4-translate, read by pipeline/build_map_v4.py)
#
# Map v3 stays exactly as published. Games with no Steam tag votes are
# translated into v3's vector space and placed next to the v3 games they
# translate closest to. Measured results and the reasons for each number:
# docs/map-v4.md. Proposed by Ronnie, Kayne approves before anything is
# published.
# =============================================================================
translation:
  map_version: "v4"
  # The published v3 map whose positions, clusters and colours are kept.
  base_map_db: "data/map.db"
  base_map_version: "v3"

  # --- the translator (pipeline/translate.py, class Translator) ---
  ridge_lambda: 10.0
  # Feature columns at least this many training games share; rarer ones are noise.
  min_feature_games: 5

  # --- recommendations ---
  # CSLS hub correction: how many closest translated games make up a v3 game's hub score.
  csls_k: 10

  # --- placement (v3 points never move) ---
  placement:
    group_radius: 25.0       # recommendations closer than this count as one group
    similarity_power: 4      # how much more a close match counts than a weaker one
    spacing_neighbor: 3      # local spacing = distance to the 3rd nearest v3 game
    spacing_min: 0.5
    spacing_max: 8.0
    spread_steps: 40
    spread_neighbors: 8
    push: 0.5
    pull: 0.05               # share of the way back to the target per step
    colour_neighbors: 15     # cluster = most common v3 cluster among this many nearby v3 points

  # --- who goes on the map ---
  map_gate:
    min_features: 3
    require_description: true
    # Stricter option: 0.8 keeps about 94,700 new games instead of 147,000,
    # but leaves out some famous ones (Zelda BotW scores 0.71).
    min_confidence: null

  # map v4 has about 220,000 games, far over CON 3's 1,100. PERF 1-3 must be
  # retested before v4 is published for real.
  max_map_games: 230000

  # --- held-out check (pipeline/eval_translation.py) ---
  evaluation:
    test_size: 4000
    seed: 0
    min_quality: 0.60            # share of the way from random (0) to v3's own lists (1)
    min_gain_over_text: 2.0      # must be at least this many times better than description-only


# =============================================================================
# 7. SOURCES - where games come from, and how the two datasets merge
#
# Steam is the main source. Its settings are the dataset / selection / fields
# sections above, left exactly where they were because Kayne's tools read
# them there. IGDB is the second source and everything about it is here.
#
# The rules in short (the full write-up is in DATABASE.md):
#   1. Steam is imported first with the same game ids main gives it.
#   2. Steam's own duplicate apps (same game sold under several app ids) are
#      folded into one game, keeping every app id in game_sources.
#   3. Each IGDB game is matched to at most one Steam game. A match keeps the
#      Steam game and every Steam value; IGDB only fills empty columns and
#      adds features Steam did not have.
#   4. IGDB games with no match become new games, numbered after Steam in
#      IGDB id order, so the ids are the same on every machine (REL 2).
# =============================================================================
sources:
  steam:
    # Pointer, not a copy: a second copy of the Steam settings could drift.
    settings_from: [dataset, selection, fields]
    # Which Steam tags or genres mark a game as adult content (games.is_adult).
    # "Nudity" is NOT here on purpose: it is on mainstream games like The
    # Witcher 3, and a safe-mode switch should not hide those.
    adult_markers: ["Sexual Content", "NSFW", "Hentai"]
    # The three platform columns, and the name platforms_raw shows for each.
    # Spelled the way IGDB spells them, so a merged game lists each platform once.
    platform_columns: {windows: "PC (Microsoft Windows)", mac: "Mac", linux: "Linux"}

  igdb:
    enabled: true
    csv_path: "data/raw/game_dataset_cleaned.csv"
    source_name: "kaggle_igdb_games"
    # TODO (CON 4): fill in the Kaggle dataset link, its license and the date
    # the snapshot was taken, then credit it on the Help page.
    dataset_url: null
    license: null
    retrieved_at: null
    # Release dates after this day are flagged games.is_upcoming = 1. It is a
    # fixed date, not "today", so two people importing on different days
    # still get identical tables (REL 2). This is the day the data was checked.
    upcoming_after: "2026-11-16"
    rating_scale: "0-100"
    rating_kind: "igdb_user_score"

    # IGDB "categories" we leave out entirely. expanded_game is a bundle of
    # a game plus its DLC, not a game of its own. Remakes, remasters and
    # standalone expansions ARE real games and stay.
    drop_categories: ["expanded_game"]

    # Summaries shorter than this are not real descriptions ("Fishing",
    # "Duh"), so they become NULL.
    min_summary_chars: 15
    # games.description is the summary cut at a sentence end near this length,
    # so it fits the same space as Steam's one or two sentence blurb.
    short_description_chars: 350

    # Do not import until at least this share of IGDB genres, perspectives and
    # game modes reach a weighted feature (or are demoted to a tag on purpose).
    min_alias_coverage: 0.95
    coverage_gated_fields: [genres, player_perspectives, game_modes]

    # Same idea as selection.demote_genres_to_tags for Steam.
    demote_genres_to_tags: ["Indie"]
    # Which IGDB theme marks a game as adult content.
    adult_markers: ["Erotic"]

    column_sources:
      title:            {from: name, transform: clean_display_title}
      title_search:     {from: name, transform: normalise_title}
      release_date:     {from: release_date, transform: iso_date}
      release_year:     {from: release_date, transform: year_from_date}
      description:      {from: summary, transform: short_summary}
      long_description: {from: summary, transform: clean_summary}
      developers:       {from: main_developers, transform: join_list}
      publishers:       {from: publishers, transform: join_list}
      cover_image_url:  {from: cover_url, transform: clean_text,
                         note: "IGDB's tall box-art cover."}
      header_image_url: {from: screenshot_urls, transform: first_list_item, fallback: cover_url,
                         note: "First screenshot (wide). Cover when there are no screenshots."}
      rating:           {from: rating, transform: number,
                         note: "IGDB user score, 0 to 100. rating_kind says so."}
      # IGDB has no store page, playtime or review count, so store_url,
      # playtime_hours, rating_count and popularity stay NULL.

    # Which IGDB list feeds which feature category. Everything goes through
    # the same alias map as Steam, so "Open world" and "Open World" become
    # the same feature.
    feature_sources:
      genre:       {from: genres,              via: direct_or_alias}
      multiplayer: {from: game_modes,          via: aliases}
      perspective: {from: player_perspectives, via: aliases}
      platform:    {from: platforms,           via: platform_families}
      theme:       {from: themes,              via: aliases}
      tag:         {from: [themes, keywords],  via: fallthrough}
      gameplay:    {from: [themes, keywords],  via: aliases}
      mechanic:    {from: [themes, keywords],  via: aliases}
      structure:   {from: [themes, keywords],  via: aliases}

    # The IGDB columns that are lists, and that get the list clean-up
    # (re-join items split at a comma inside brackets, trim, dedupe).
    list_columns: [genres, themes, keywords, player_perspectives, game_modes,
                   platforms, main_developers, supporting_developers,
                   publishers, franchise, series, game_engines,
                   screenshot_urls, artwork_urls]
    # Company lists where a lone suffix like "LLC" got split off its name.
    company_columns: [main_developers, supporting_developers, publishers]
    rejoin_suffixes: ["LLC", "Inc.", "Inc", "Ltd.", "Ltd", "Co.", "S.A."]
    # Kept in games.raw_igdb_json, untouched apart from that clean-up.
    raw_columns: [category, genres, themes, keywords, player_perspectives,
                  game_modes, platforms, franchise, series, game_engines,
                  supporting_developers, aggregated_rating]
    # aggregated_rating 0 means "nobody rated it", not a score of zero.
    zero_is_missing: [aggregated_rating]

    # EXPLICIT platform list. Never a substring match: "PC Engine" and
    # "PC-FX" are Japanese consoles, not PCs. An IGDB game that lists
    # platforms but none of these cannot be the Steam game, so it never merges.
    pc_platforms: ["PC (Microsoft Windows)", "Mac", "Linux", "DOS", "SteamVR",
                   "Oculus VR", "Oculus Rift", "Windows Mixed Reality"]

    # DRAFT for Austin: which IGDB platform names go in each platform family.
    # Anything not listed is kept in games.platforms_raw but gets no feature;
    # the report lists them.
    platform_families:
      windows: ["PC (Microsoft Windows)"]
      macos: ["Mac"]
      linux: ["Linux"]
      dos: ["DOS"]
      pc_vr: ["SteamVR", "Oculus VR", "Oculus Rift", "Windows Mixed Reality"]
      standalone_vr: ["Meta Quest 2", "Meta Quest 3", "Oculus Quest", "Oculus Go",
                      "PlayStation VR", "PlayStation VR2", "Gear VR", "Daydream",
                      "visionOS"]
      playstation: ["PlayStation", "PlayStation 2", "PlayStation 3", "PlayStation 4",
                    "PlayStation 5", "PlayStation Portable", "PlayStation Vita",
                    "PocketStation"]
      xbox: ["Xbox", "Xbox 360", "Xbox One", "Xbox Series X|S"]
      nintendo: ["Nintendo Switch", "Nintendo Switch 2", "Wii", "Wii U",
                 "Nintendo GameCube", "Nintendo 64", "64DD",
                 "Nintendo Entertainment System", "Family Computer",
                 "Family Computer Disk System", "Super Nintendo Entertainment System",
                 "Super Famicom", "Satellaview", "Game Boy", "Game Boy Color",
                 "Game Boy Advance", "Nintendo DS", "Nintendo DSi", "Nintendo 3DS",
                 "New Nintendo 3DS", "Virtual Boy", "Game & Watch", "Pokémon mini",
                 "e-Reader / Card-e Reader", "Super NES CD-ROM System"]
      sega: ["Sega Mega Drive/Genesis", "Sega Master System/Mark III", "Sega Saturn",
             "Dreamcast", "Sega Game Gear", "Sega CD", "Sega 32X", "Sega CD 32X",
             "SG-1000", "Sega Pico", "Visual Memory Unit / Visual Memory System"]
      mobile: ["iOS", "Android", "Windows Phone", "Windows Mobile", "BlackBerry OS",
               "Legacy Mobile Device", "Palm OS", "N-Gage"]
      web_browser: ["Web browser"]
      arcade_cabinet: ["Arcade"]
      retro_computer: ["Commodore C64/128/MAX", "Amiga", "Amiga CD32", "ZX Spectrum",
                       "Amstrad CPC", "Atari ST/STE", "Atari 8-bit", "Apple II",
                       "Apple IIGS", "MSX", "MSX2", "PC-9800 Series", "PC-8800 Series",
                       "BBC Microcomputer System", "Sharp X68000", "Sharp X1",
                       "FM Towns", "FM-7", "Commodore VIC-20", "Commodore 16",
                       "Commodore Plus/4", "Commodore PET", "Acorn Electron",
                       "Acorn Archimedes", "Sinclair ZX81", "TRS-80",
                       "TRS-80 Color Computer", "Texas Instruments TI-99",
                       "Dragon 32/64", "NEC PC-6000 Series", "Amstrad PCW",
                       "Thomson MO5", "Tatung Einstein", "Sinclair QL", "Sharp MZ-2200"]
      other_console: ["TurboGrafx-16/PC Engine", "Turbografx-16/PC Engine CD",
                      "PC Engine SuperGrafx", "PC-FX", "3DO Interactive Multiplayer",
                      "Atari 2600", "Atari 5200", "Atari 7800", "Atari Jaguar",
                      "Atari Jaguar CD", "Atari Lynx", "Neo Geo AES", "Neo Geo MVS",
                      "Neo Geo CD", "Neo Geo Pocket", "Neo Geo Pocket Color",
                      "ColecoVision", "Intellivision", "Vectrex", "Philips CD-i",
                      "WonderSwan", "WonderSwan Color", "Odyssey 2 / Videopac G7000",
                      "Ouya", "Google Stadia", "Playdate", "Arduboy", "Evercade",
                      "Amazon Fire TV", "Zeebo", "Gizmondo"]

    # How IGDB games are matched to Steam games. See pipeline/matching.py.
    matching:
      # Description similarity (TF-IDF cosine) thresholds:
      #   below separate_below          different games
      #   at or above merge_at_or_above same game (only used when nothing else decides)
      #   in between                    a person has to look (data/match_review.csv)
      separate_below: 0.1
      merge_at_or_above: 0.5
      # A description shorter than this is too little to compare.
      min_description_chars: 40
      # When two IGDB entries want the same Steam game, the lower rank wins.
      category_rank: {main_game: 0, standalone_expansion: 1, remaster: 2, remake: 3}
      # Words dropped from company names before comparing them, so
      # "Bethesda Game Studios" and "Bethesda Softworks LLC" can be compared.
      company_suffixes: [inc, ltd, llc, gmbh, co, corp, corporation, studio, studios,
                         games, game, entertainment, interactive, software,
                         productions, publishing, the]
      # Words dropped for the last-chance "edition" key. A match on that key
      # alone is never merged, only listed (remasters and special editions).
      edition_words: ["the", "game of the year", "goty", "definitive", "deluxe",
                      "ultimate", "complete", "enhanced", "anniversary", "remastered",
                      "remaster", "hd", "director s cut", "directors cut", "special",
                      "gold", "premium", "standard", "digital", "collector s",
                      "collectors", "legacy", "edition", "version", "bundle",
                      "collection"]
      # A person's final word on a pair, applied after every rule.
      overrides_path: "config/match_overrides.yaml"

    # OPTIONAL and OFF: add features to untagged Steam games by finding alias
    # names in their description. Off until the team agrees to it.
    derived_text:
      enabled: false
      min_hits: 3
      # Never add both sides of one of these pairs to a game.
      contradictions:
        - [[structure, linear], [structure, sandbox]]
        - [[structure, linear], [structure, open_world]]
        - [[multiplayer, single_player], [multiplayer, mmo]]


# =============================================================================
# 8. NON-GAME PATTERNS
#
# Steam and IGDB both list things that are not games: soundtracks, demos,
# playtests, dedicated servers. A title that matches one of these gets
# games.is_non_game = 1. It STAYS in the database (so a Steam library lookup
# still finds it) but should stay off the map. Every match is listed in
# data/merge_report.md so a person can check none of them is a real game.
#
# These are regular expressions, matched ignoring capitals. "alpha", "beta"
# and "demo" only count as a separate word at the end or in brackets,
# otherwise "Alpha Protocol" and "Sid Meier's Alpha Centauri" would be caught.
# =============================================================================
non_game_patterns:
  - "friend'?s pass"
  - "\\bplaytest\\b"
  - "\\b(open|closed|public|private)\\s+(beta|alpha)\\b"
  - "\\b(beta|alpha)\\s+(test|testing|build|version|branch|client|weekend)\\b"
  - "[\\(\\[]\\s*(beta|alpha)\\s*[\\)\\]]"
  - "[-:]\\s*(beta|alpha)\\s*$"
  - "\\bstress test\\b"
  - "\\btechnical test\\b"
  - "\\bpublic test\\b"
  - "\\btest server\\b"
  - "\\bdedicated server\\b"
  - "\\bearly access weekend\\b"
  - "\\bfree weekend\\b"
  - "\\bdemo\\b"
  - "\\bsoundtracks?\\b"
  - "(?-i:\\bOST\\b)"
  - "(?-i:\\bSDK\\b)"
  - "\\bbenchmark\\b"
  - "\\bart ?book\\b"
