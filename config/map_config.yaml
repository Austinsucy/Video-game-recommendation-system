# -----------------------------------------------------------------------------
# Aliases: raw source string -> [category, feature name]
#
# Anything NOT listed here falls through to the display-only `tag` category,
# so no information is lost - it just is not weighted. The import report lists
# the most common unmapped tags so Austin/Kayne know what to add next.
#
# A tag mapped here does NOT also become a `tag` feature. That is how the
# "avoid counting the same concept twice" rule is enforced.
# -----------------------------------------------------------------------------
aliases:
  # --- from the `genres` column ---
  "Action": [genre, action]
  "Adventure": [genre, adventure]
  "RPG": [genre, rpg]
  "Role Playing": [genre, rpg]
  "Strategy": [genre, strategy]
  "Simulation": [genre, simulation]
  "Sports": [genre, sports]
  "Racing": [genre, racing]
  "Casual": [genre, casual]
  "Massively Multiplayer": [genre, massively_multiplayer]

  # --- tags that are really genres ---
  "Shooter": [genre, shooter]
  "FPS": [genre, shooter]
  "Platformer": [genre, platformer]
  "2D Platformer": [genre, platformer]
  "Puzzle": [genre, puzzle]
  "Fighting": [genre, fighting]
  "Visual Novel": [genre, visual_novel]
  "Survival": [genre, survival]
  "Horror": [genre, horror]
  "Action-Adventure": [genre, adventure]
  "Arcade": [genre, casual]

  # --- gameplay ---
  "Exploration": [gameplay, exploration]
  "Combat": [gameplay, combat]
  "Story Rich": [gameplay, story_driven]
  "Narration": [gameplay, story_driven]
  "Building": [gameplay, building]
  "Management": [gameplay, management]
  "Driving": [gameplay, racing_driving]
  "Stealth": [gameplay, stealth_play]
  "Farming": [gameplay, farming]
  "Farming Sim": [gameplay, farming]
  "Survival Horror": [gameplay, survival_play]

  # --- mechanic ---
  "Crafting": [mechanic, crafting]
  "Deckbuilding": [mechanic, deck_building]
  "Card Game": [mechanic, deck_building]
  "Turn-Based": [mechanic, turn_based]
  "Turn-Based Strategy": [mechanic, turn_based]
  "Turn-Based Combat": [mechanic, turn_based]
  "Real-Time": [mechanic, real_time]
  "Real Time Tactics": [mechanic, real_time]
  "RTS": [mechanic, real_time]
  "Physics": [mechanic, physics]
  "Base Building": [mechanic, base_building]
  "Character Customization": [mechanic, character_customization]
  "Loot": [mechanic, looting]
  "Looter Shooter": [mechanic, looting]
  "Tower Defense": [mechanic, tower_defense]
  "Point & Click": [mechanic, point_and_click]

  # --- structure ---
  "Open World": [structure, open_world]
  "Linear": [structure, linear]
  "Sandbox": [structure, sandbox]
  "Roguelike": [structure, roguelike]
  "Roguelite": [structure, roguelike]
  "Rogue-like": [structure, roguelike]
  "Procedural Generation": [structure, procedural]
  "Level Editor": [structure, level_based]
  "Episodic": [structure, episodic]
  "Multiple Endings": [structure, multiple_endings]
  "Choices Matter": [structure, multiple_endings]

  # --- theme ---
  "Fantasy": [theme, fantasy]
  "Dark Fantasy": [theme, fantasy]
  "Sci-fi": [theme, sci_fi]
  "Science": [theme, sci_fi]
  "Historical": [theme, historical]
  "World War II": [theme, historical]
  "Psychological Horror": [theme, horror_theme]
  "Post-apocalyptic": [theme, post_apocalyptic]
  "Military": [theme, military]
  "War": [theme, military]
