# =============================================================================
# Goon Squad - single configuration file (MAINT 2)
#
# Everything the map pipeline is allowed to tune lives here. Changing a weight
# or the vocabulary must NOT require editing any code.
#
# STATUS: the `vocabulary` and `aliases` sections below are a STARTER STUB
# written by Ronnie so the import process could be built and tested.
# Austin + Kayne own the real contents: which features exist, which raw Steam
# tag maps to which category, and what the category weights should be.
# Extend freely - the importer validates this file and reports what it could
# not map, so nothing silently disappears.
# =============================================================================

map_version: "v1"
random_seed: 42          # REL 2: every randomised step in the pipeline uses this
cluster_count: 12        # placeholder - Austin/Kayne decide

# -----------------------------------------------------------------------------
# Dataset + selection rule
# -----------------------------------------------------------------------------
dataset:
  csv_path: "data/raw/games_march2025_cleaned.csv"
  source_name: "kaggle_artermiloff_steam_2025"
  retrieved_at: "2025-03-01"          # snapshot date of the Kaggle export
  store_url_template: "https://store.steampowered.com/app/{appid}/"

selection:
  target_count: 1000                  # CON 3 caps the published map at 1100

  # --- HOW THE 1000 ARE CHOSEN -----------------------------------------------
  # "popular_recent"  = newest years first, most reviewed      <- Ron's answer
  # "popular_pre2019" = <= max_year only, most reviewed        <- matches CON 3
  #
  # !! These two disagree. CON 3 of the NFR document says the published map is
  # !! "approximately 1,000 mostly pre-2019 games". Flip this one value to
  # !! switch; nothing else changes.
  mode: "popular_recent"

  max_year: 2018                      # only used when mode == popular_pre2019
  min_year: 2019                      # only used when mode == popular_recent
  rank_by: "num_reviews_total"        # deterministic, fully populated
  tie_breaker: "title"                # REL 2: makes the pick reproducible

  # DATA 1 minimums
  min_genres: 1
  min_tags: 3

  # Raw `genres` values that are NOT games. Set to [] to keep them.
  # Ron's call was to keep them, so this list is empty by default.
  exclude_genres: []

  # Raw `genres` values that are content warnings or business models rather
  # than genres. These are kept on the game but recorded as display-only
  # `tag` features so they do not get weighted as genres.
  demote_genres_to_tags:
    - "Early Access"
    - "Free To Play"
    - "Indie"
    - "Gore"
    - "Nudity"
    - "Violent"
    - "Sexual Content"

  # Values in Steam's `categories` column that describe how many people play.
  # Everything else in that column is a Steam store feature (Trading Cards,
  # Remote Play, HDR...) and is ignored.
  multiplayer_categories:
    "Single-player": single_player
    "Multi-player": multiplayer
    "Co-op": co_op
    "Online Co-op": online_co_op
    "LAN Co-op": lan_co_op
    "PvP": pvp
    "Online PvP": online_pvp
    "LAN PvP": lan_pvp
    "MMO": mmo
    "Shared/Split Screen": split_screen
    "Shared/Split Screen Co-op": split_screen_co_op
    "Shared/Split Screen PvP": split_screen_pvp
    "Cross-Platform Multiplayer": cross_platform
    "Remote Play Together": remote_play_together

# -----------------------------------------------------------------------------
# Field mapping: our `games` column <- raw CSV column
# Zero is Steam's "no data" sentinel on several fields, so the importer turns
# 0 into NULL for anything listed in zero_is_missing.
# -----------------------------------------------------------------------------
fields:
  rating_source: "pct_pos_total"          # percent positive, 0-100
  rating_scale: "0-100"
  rating_count_source: "num_reviews_total"
  popularity_source: "num_reviews_total"
  playtime_source: "average_playtime_forever"   # MINUTES, average over recent players
  playtime_definition: "Steam average playtime forever (minutes), converted to hours"
  zero_is_missing:
    - "metacritic_score"
    - "user_score"
    - "average_playtime_forever"

# -----------------------------------------------------------------------------
# NOTE: only the `category_weighted` vectorization method reads these weights.
# The other methods work on raw tag votes. Which method publishes is an open
# team decision (GM 1).
#
# Category weights - Austin/Kayne tune these.
# `tag` is 0.0 on purpose: the scrum doc says display tags must not become an
# extra weighted category or double-count a concept already captured elsewhere.
# -----------------------------------------------------------------------------
category_weights:
  genre: 1.0
  gameplay: 1.0
  mechanic: 1.0
  structure: 0.8
  theme: 0.8
  multiplayer: 0.5
  perspective: 0.5
  platform: 0.2
  tag: 0.0

# -----------------------------------------------------------------------------
# Tag vectorization (pipeline/vectorize.py). Compare the methods with
# `python -m pipeline.compare_vectors`, then set `method` to the winner.
# -----------------------------------------------------------------------------
vectorization:
  method: "votes_log_idf"      # PLACEHOLDER until Kayne/Austin pick from the comparison
  description_floor: 0.4       # weight of a present tag the description never mentions
  hybrid_alpha: 0.7            # hybrid_* = alpha * votes_log + (1 - alpha) * description
  rank_depth: 20               # Steam keeps each game's top 20 tags
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"   # pinned Hugging Face commit (REL 2)
  embedding_tag_template: "a video game tagged {tag}"

# -----------------------------------------------------------------------------
# Map layout (pipeline/build_map.py). cluster_count and random_seed are above.
# -----------------------------------------------------------------------------
layout:
  neighbor_count: 15           # neighbours stored per game; the scrum doc allows 10-15
  method: "tsne"               # tsne keeps ~4x more true neighbours close on the map than pca; GM 1 originally said PCA
  tsne_perplexity: 30          # roughly how many neighbours t-SNE preserves per game
  coordinate_extent: 1000.0    # layout output is scaled so the largest |x| or |y| equals this (collision separation can push a point slightly past it)
  collision_min_distance: 1.0  # games closer than this (e.g. identical tag vectors) are spread apart
  # Colour-blind-friendly (ACC 3): Okabe-Ito, then four Paul Tol "muted" colours.
  # Twelve categorical colours cannot all be told apart at a glance, so the legend
  # must always label clusters by name, never by colour alone.
  cluster_colors:
    - "#E69F00"
    - "#56B4E9"
    - "#009E73"
    - "#F0E442"
    - "#0072B2"
    - "#D55E00"
    - "#CC79A7"
    - "#999999"
    - "#882255"
    - "#44AA99"
    - "#DDCC77"
    - "#332288"

